<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow reading column, like a charter being drafted; setup, then one question per screen, then the analysis.
   Colors and type follow the Dougalien Systems look (logo sand, slate and rust; Familjen Grotesk headings), as in the other Dougalien apps. */
:root {
  --bg: #F4F4F1;
  --paper: #FFFFFF;
  --ink: #1B1E20;
  --muted: #586770;
  --rule: #D6DBDA;
  --accent: #3E5C6B;
  --accent-soft: #EFE8DA;
  --seal: #B4532A;
  --bar: #D6B27C;
  --on-accent: #FFFFFF;
  --sand: #D6B27C; --slate: #3E5C6B; --rust: #B4532A;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --quote: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181A; --paper: #1C2225; --ink: #ECEAE5; --muted: #9DABB1; --rule: #2C3539;
    --accent: #9CC0CF; --accent-soft: #263239; --seal: #E0825A; --bar: #8E7650; --on-accent: #0F1518;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181A; --paper: #1C2225; --ink: #ECEAE5; --muted: #9DABB1; --rule: #2C3539;
  --accent: #9CC0CF; --accent-soft: #263239; --seal: #E0825A; --bar: #8E7650; --on-accent: #0F1518;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 17px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-weight: 700; letter-spacing: -0.03em; }
h1 { font-size: clamp(2.1rem, 6vw, 3rem); }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
.eyebrow { font: 500 0.75rem/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 24px; }
header.mast { display: flex; flex-direction: column; gap: 10px; padding-bottom: 22px; border-bottom: 5px solid transparent;
  border-image: linear-gradient(90deg, var(--sand) 0 22%, var(--slate) 22% 34%, var(--sand) 34% 62%, var(--rust) 62% 70%, var(--sand) 70% 88%, var(--slate) 88% 100%) 1; }
header.mast p { max-width: 60ch; color: var(--muted); }

button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); padding: 10px 20px; border-radius: 4px; font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.chip { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 0.9rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 0; font-size: 0.95rem; }
:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }

/* Setup */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.thinker { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; padding: 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); cursor: pointer; }
.thinker:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.thinker input { margin-top: 5px; accent-color: var(--accent); width: 16px; height: 16px; }
.thinker strong { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
.thinker .lived { grid-column: 2; font: 0.75rem/1.3 var(--mono); color: var(--muted); }
.thinker .idea { grid-column: 2; font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
.sharebox { display: flex; gap: 8px; flex-wrap: wrap; }
.sharebox input { flex: 1 1 260px; min-width: 0; font: 0.85rem var(--mono); padding: 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--ink); }

/* Quiz */
.progress { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width 0.3s; }
.qhead { display: flex; justify-content: space-between; gap: 12px; font: 0.8rem var(--mono); color: var(--muted); }
.question { font-size: clamp(1.4rem, 4vw, 1.9rem); }
.answers { display: flex; flex-direction: column; gap: 10px; }
.answer { text-align: left; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); padding: 14px 16px; border-radius: 4px; display: grid; grid-template-columns: 1.6rem 1fr; gap: 10px; line-height: 1.4; }
.answer .letter { font: 500 0.85rem/1.6 var(--mono); color: var(--muted); }
.answer:hover { border-color: var(--accent); }
.answer[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.answer[aria-pressed="true"] .letter { color: var(--accent); }
.matters { display: flex; gap: 8px; align-items: center; font-size: 0.95rem; color: var(--muted); }
.matters input { accent-color: var(--seal); width: 18px; height: 18px; }
.nav { display: flex; justify-content: space-between; gap: 10px; }

/* Results */
.verdict { display: flex; flex-direction: column; gap: 8px; }
.verdict .big { font-family: var(--display); font-weight: 700; letter-spacing: -0.03em; color: var(--ink); font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; }
.verdict .big em { color: var(--accent); font-style: normal; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(7rem, 12rem) 1fr 3.2rem; gap: 10px; align-items: center; font-size: 0.92rem; }
.bar .track { height: 14px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--bar); }
.bar.top .fill { background: var(--accent); }
.bar.top .name { font-weight: 700; }
.bar .pct { font: 0.9rem var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.match { display: flex; flex-direction: column; gap: 12px; padding-block: 20px; border-top: 1px solid var(--rule); }
.match:first-of-type { border-top: none; padding-top: 0; }
.match .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.match .head .pct { font: 500 1.1rem var(--mono); color: var(--accent); }
blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--seal); font-family: var(--quote); font-style: italic; color: var(--ink); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pair > div { min-width: 0; }
.pair h4 { margin: 0 0 6px; font: 500 0.75rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pair ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.charter { display: flex; flex-direction: column; gap: 14px; }
.article { display: grid; grid-template-columns: 6.5rem 1fr; gap: 12px; }
.article .num { font: 500 0.75rem/1.9 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--seal); }
.article ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-family: var(--quote); }
.article .star { color: var(--seal); font-family: var(--body); font-size: 0.8rem; }
ol.discuss { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.toast { font-size: 0.9rem; color: var(--accent); }
a { color: var(--accent); }
.src { display: block; margin-top: 2px; font-size: 0.8rem; line-height: 1.35; color: var(--muted); }
.src a { color: var(--muted); text-decoration-color: var(--rule); }
.src a:hover { color: var(--accent); }
blockquote .src { font-family: var(--body); font-style: normal; }
.reading { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.reading .note { color: var(--muted); font-size: 0.82rem; }
.key-q { display: flex; flex-direction: column; gap: 10px; padding-block: 18px; border-top: 1px solid var(--rule); }
.key-q:first-of-type { border-top: none; padding-top: 0; }
.key-a { display: flex; flex-direction: column; gap: 4px; }
.key-a > strong { font-weight: 700; }
.key-a ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
.key-a .tag { font: 0.72rem var(--mono); color: var(--seal); }
/* Timeline */
.chartwrap { overflow-x: auto; }
.tl { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--rule); margin-left: 6px; }
.tl-item { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 26px 22px; }
.tl-item::before { content: ""; position: absolute; left: -7px; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.tl-item.off::before { background: var(--rule); }
.tl-item.off { opacity: 0.7; }
.tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tl-head .pct { font: 500 0.85rem var(--mono); color: var(--accent); }
.tl-item .lived { font: 0.8rem var(--mono); color: var(--muted); }
.tl-item h4 { margin: 4px 0 0; font: 500 0.72rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--seal); }
.events { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.events li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 10px; font-size: 0.93rem; }
.events .when { font: 0.8rem/1.7 var(--mono); color: var(--muted); }
.conn { font-size: 0.93rem; color: var(--muted); }
.conn strong { color: var(--ink); }
/* Lessons */
.lesson-card { display: flex; flex-direction: column; gap: 10px; }
.lesson-card .vs { font: 500 0.8rem var(--mono); color: var(--seal); letter-spacing: 0.06em; text-transform: uppercase; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font: 0.78rem var(--mono); }
.steps li { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
.steps li.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.steps li.done { color: var(--accent); }
.feedback { font-size: 0.95rem; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 4px 4px 0; }
.lq { display: flex; flex-direction: column; gap: 10px; padding-block: 18px; border-top: 1px solid var(--rule); }
.lq:first-child { border-top: none; padding-top: 0; }
.lq h3 { font-size: 1.15rem; }
.ctx { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 12px; align-items: center; }
.ctx .cell { background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 10px 12px; font-size: 0.92rem; }
.ctx .arrow { color: var(--seal); font-family: var(--mono); }
.ctx .lab { font: 500 0.7rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.excerpt { display: flex; flex-direction: column; gap: 6px; }
.excerpt .who { font: 500 0.72rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
textarea.claim { width: 100%; min-height: 180px; font: 1rem/1.5 var(--body); padding: 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); }
@media (max-width: 560px) {
  .ctx { grid-template-columns: 1fr; }
  .ctx .arrow { transform: rotate(90deg); justify-self: start; }
  .events li { grid-template-columns: 1fr; gap: 0; }
  .sheet { padding: 18px; }
  .pair { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 6.5rem 1fr 3rem; font-size: 0.85rem; }
  .article { grid-template-columns: 1fr; gap: 4px; }
}
/* Branding */
footer.brand { max-width: 760px; margin: 48px auto 0; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
footer.brand { border-top: 2px solid var(--ink); font-family: var(--mono); font-size: 0.78rem; }
footer.brand .mark { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; min-height: 44px; }
footer.brand .mark span { font: 700 1rem var(--display); letter-spacing: -0.01em; }
footer.brand .mark:hover span { color: var(--seal); }
footer.brand svg { width: 28px; height: 28px; flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = __DATA__;
const ARTIFACT_URL = "__URL__";
// Hosts that can't use #links (Streamlit) pass the starting link in START_HASH and a base ending in "?go=".
const startHash = () => location.hash || window.START_HASH || "";
const T = Object.fromEntries(DATA.thinkers.map(t => [t.id, t]));
const BY_CODE = Object.fromEntries(DATA.thinkers.map(t => [t.code, t.id]));
const LETTERS = "ABCDEF";
const PRESETS = [
  ["All thinkers", DATA.thinkers.map(t => t.id)],
  ["The social contract", ["hobbes", "locke", "rousseau"]],
  ["Ancient and classical", ["confucius", "plato", "aristotle", "ibnkhaldun", "machiavelli"]],
  ["Enlightenment and revolution", ["locke", "montesquieu", "rousseau", "burke", "paine", "wollstonecraft"]],
  ["Rights and equality", ["wollstonecraft", "mill", "douglass", "gandhi", "beauvoir", "king"]],
  ["Modern justice", ["marx", "arendt", "rawls", "nozick", "king"]],
];
const SAVE_KEY = "perfect-society-v1";
const LESSONS = Object.fromEntries(DATA.lessons.map(l => [l.id, l]));

let state = load() || fresh();
const fromHash = parseHash();
if (fromHash && !(state.locked && state.selected.join() === fromHash.join())) { state = fresh(); state.selected = fromHash; state.locked = true; }
const lessonFromHash = parseLessonHash();
if (lessonFromHash) { state.lessonId = lessonFromHash; state.screen = "lesson"; }
else if (state.screen === "lesson") state.screen = "lessons";

function fresh() {
  return { screen: "setup", selected: DATA.thinkers.map(t => t.id), answers: DATA.questions.map(() => null), weights: DATA.questions.map(() => false), i: 0, locked: false };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.answers && s.answers.length === DATA.questions.length) return s; } catch (e) {}
  return window.claude?.hot?.data?.state || null;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
window.claude?.hot?.snapshot?.(() => ({ state }));

function parseHash() {
  const h = startHash().replace(/^#/, "");
  if (!h.startsWith("set-")) return null;
  const ids = h.slice(4).split("-").map(c => BY_CODE[c]).filter(Boolean);
  return ids.length >= 2 ? ids : null;
}
function parseLessonHash() {
  const h = decodeURIComponent(startHash().replace(/^#/, ""));
  return h.startsWith("lesson-") && LESSONS[h.slice(7)] ? h.slice(7) : null;
}
const linkTo = h => ARTIFACT_URL.endsWith("?go=") ? ARTIFACT_URL + h : (ARTIFACT_URL.startsWith("http") ? ARTIFACT_URL : location.href.split("#")[0]) + "#" + h;
function setHash() { return "set-" + DATA.thinkers.filter(t => state.selected.includes(t.id)).map(t => t.code).join("-"); }
function shareLink() { return linkTo(setHash()); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
function go(screen) { state.screen = screen; save(); syncLessonHash(); render(); window.scrollTo(0, 0); }
// Keep the address bar on #lesson-<id> while a lesson is open, so a reload stays in the lesson.
function syncLessonHash() {
  try {
    const want = state.screen === "lesson" ? "#lesson-" + state.lessonId : "";
    const isLesson = /^#lesson-/.test(location.hash);
    if (want && location.hash !== want) history.replaceState(null, "", want);
    else if (!want && isLesson) history.replaceState(null, "", location.pathname + location.search);
  } catch (e) {}
}

function render() {
  if (state.screen === "quiz") return renderQuiz();
  if (state.screen === "results") return renderResults();
  if (state.screen === "timeline") return renderTimeline();
  if (state.screen === "sources") return renderSources();
  if (state.screen === "lessons") return renderLessons();
  if (state.screen === "lesson" && LESSONS[state.lessonId]) return renderLesson();
  renderSetup();
}
// The timeline and the sources page can open from anywhere, so remember the way back.
function openPage(screen) { state.back = [...(state.back || []), state.screen].filter(x => x !== screen).slice(-4); go(screen); }
const openTimeline = () => openPage("timeline");
const openSources = () => openPage("sources");
const prevScreen = () => (state.back || []).slice(-1)[0] || "setup";
const backLabel = () => ({ results: "Back to my results", quiz: "Back to the questions", timeline: "Back to the timeline", lesson: "Back to the lesson", lessons: "Back to lessons" }[prevScreen()] || "Back");
const goBack = () => { const to = prevScreen(); state.back = (state.back || []).slice(0, -1); go(to); };

/* ---------- Sources ----------
   Every thinker position links to the passage it comes from (see sources.py). Where no single passage
   was pinned down, the link goes to the thinker's main work instead. */
const W = DATA.works;
const ext = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>`;
function cite(id, i, lead = "Source") {
  const c = T[id].cites[i];
  if (!c) return "";
  const w = W[c.work];
  return c.general
    ? `<span class="src">Read more: ${ext(c.url, `<i>${esc(w.title)}</i>`)} (${esc(w.year)})</span>`
    : `<span class="src">${lead}: ${ext(c.url, `<i>${esc(w.title)}</i>, ${esc(c.loc)}`)}</span>`;
}
function quoteCite(t) {
  const c = t.quoteSrc; if (!c) return "";
  const w = W[c.work];
  return `<span class="src">${ext(c.url, `${esc(short(t.id))}, <i>${esc(w.title)}</i>${c.loc ? `, ${esc(c.loc)}` : ""}`)} (${esc(w.year)})</span>`;
}
const readingList = t => `<ul class="reading">${t.read.map(k => `<li>${ext(W[k].url, `<i>${esc(W[k].title)}</i>`)} (${esc(W[k].year)}) <span class="note">${esc(W[k].note)}.</span></li>`).join("")}</ul>`;
const citeText = (id, i) => { const c = T[id].cites[i]; if (!c) return ""; const w = W[c.work]; return `${w.title}${c.general ? "" : ", " + c.loc} ${c.url}`; };
const finished = () => state.answers.every(a => a !== null);

/* ---------- History machine ----------
   Lifespans on one axis with a break: 600–300 BCE gets the left 22%, 1300–2025 CE the rest,
   since no thinker here lived in between. */
const AX = { left: 170, width: 570, a0: -600, a1: -300, b0: 1300, b1: 2025, aw: 0.22, gap: 0.04 };
function xOf(y) {
  const { left, width, a0, a1, b0, b1, aw, gap } = AX;
  if (y <= a1) return left + ((y - a0) / (a1 - a0)) * aw * width;
  return left + (aw + gap) * width + ((y - b0) / (b1 - b0)) * (1 - aw - gap) * width;
}
const yearLabel = y => y < 0 ? `${-y} BCE` : `${y}`;
function lifespanChart(pcts) {
  const rowH = 22, top = 34, list = DATA.thinkers, h = top + list.length * rowH + 8;
  const sel = new Set(state.selected);
  const ranked = pcts ? Object.entries(pcts).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]) : [];
  const ticks = [-550, -350, 1400, 1500, 1600, 1700, 1800, 1900, 2000];
  const bx = xOf(AX.a1) + (AX.gap * AX.width) / 2;
  let s = `<svg viewBox="0 0 760 ${h}" role="img" aria-label="Lifespans of the thinkers on a timeline" style="width:100%;min-width:620px;display:block">`;
  ticks.forEach(t => {
    const x = xOf(t);
    s += `<line x1="${x}" x2="${x}" y1="${top - 6}" y2="${h - 6}" stroke="var(--rule)" stroke-width="1"/>`;
    s += `<text x="${x}" y="${top - 12}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${yearLabel(t)}</text>`;
  });
  s += `<text x="${bx}" y="${top - 12}" text-anchor="middle" font-size="12" fill="var(--muted)">//</text>`;
  s += `<line x1="${bx}" x2="${bx}" y1="${top - 6}" y2="${h - 6}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>`;
  list.forEach((t, k) => {
    const y = top + k * rowH, x1 = xOf(t.born), x2 = xOf(t.died), on = sel.has(t.id);
    const isTop = ranked.includes(t.id), pct = pcts && pcts[t.id] != null ? ` ${pcts[t.id]}%` : "";
    const fill = isTop ? "var(--accent)" : on ? "var(--bar)" : "var(--rule)";
    s += `<g opacity="${on ? 1 : 0.55}">`;
    s += `<text x="${AX.left - 10}" y="${y + 13}" text-anchor="end" font-size="12.5" fill="var(--ink)" font-weight="${isTop ? 700 : 400}">${esc(t.name)}</text>`;
    s += `<rect x="${x1}" y="${y + 3}" width="${Math.max(3, x2 - x1)}" height="13" rx="2" fill="${fill}"/>`;
    if (pct) s += `<text x="${x2 + 6}" y="${y + 13}" font-size="11" font-family="IBM Plex Mono, monospace" fill="${isTop ? "var(--accent)" : "var(--muted)"}">${pct.trim()}</text>`;
    s += `</g>`;
  });
  return s + `</svg>`;
}

/* ---------- Scoring ----------
   Each thinker earns 2 points for an answer that is their clear position and 1 for a partial match,
   doubled on questions the student marked as important. A thinker's agreement is the share of the
   points they could have earned, so thinkers who appear in fewer answers are not buried.
   The percentages split 100% among the chosen thinkers, weighted toward stronger agreement. */
function pts(a, id) { return a.strong.includes(id) ? 2 : a.partial.includes(id) ? 1 : 0; }
function score() {
  const rows = state.selected.map(id => {
    let earned = 0, max = 0;
    DATA.questions.forEach((q, i) => {
      const w = state.weights[i] ? 2 : 1;
      const best = Math.max(...q.answers.map(a => pts(a, id)));
      if (!best) return;
      max += best * w;
      if (state.answers[i] !== null) earned += pts(q.answers[state.answers[i]], id) * w;
    });
    return { id, agree: max ? earned / max : 0 };
  });
  const total = rows.reduce((s, r) => s + r.agree ** 3, 0);
  rows.forEach(r => r.share = total ? (r.agree ** 3) / total * 100 : 100 / rows.length);
  rows.sort((a, b) => b.share - a.share);
  roundTo100(rows);
  return rows;
}
function roundTo100(rows) {
  rows.forEach(r => r.pct = Math.floor(r.share));
  let left = 100 - rows.reduce((s, r) => s + r.pct, 0);
  [...rows].sort((a, b) => (b.share % 1) - (a.share % 1)).slice(0, left).forEach(r => r.pct++);
}
function agreements(id) {
  const out = [];
  DATA.questions.forEach((q, i) => { const a = q.answers[state.answers[i]]; const p = pts(a, id); if (p) out.push({ i, p, mine: a.text }); });
  return out.sort((x, y) => y.p - x.p || state.weights[y.i] - state.weights[x.i]);
}
function disagreements(id) {
  const out = [];
  DATA.questions.forEach((q, i) => {
    const mine = q.answers[state.answers[i]];
    const theirs = q.answers.find(a => a.strong.includes(id));
    if (theirs && !pts(mine, id)) out.push({ i, mine: mine.text, theirs: theirs.text });
  });
  return out.sort((x, y) => state.weights[y.i] - state.weights[x.i]);
}
const last = name => name.replace(/ Jr\.$/, "").split(" ").slice(-1)[0];
const short = id => ({ king: "King", ibnkhaldun: "Ibn Khaldun", confucius: "Confucius", plato: "Plato", aristotle: "Aristotle", montesquieu: "Montesquieu" }[id] || last(T[id].name));

function lessonScore(l, ls) {

    return { id, agree: max ? earned / max : 0 };
  });
  const total = rows.reduce((s, r) => s + r.agree ** 3, 0);
  rows.forEach(r => r.share = total ? (r.agree ** 3) / total * 100 : 50);
  rows.sort((a, b) => b.share - a.share);
  roundTo100(rows);
  return rows;
}
const whoSays = who => who === "both" ? "This mixes both thinkers' ideas." : who ? `This lines up with ${T[who].name}.` : "";
function renderLesson() {
  const l = LESSONS[state.lessonId], ls = lessonState(l.id);
  const steps = ["Warm-up", "Questions", "Results", ...(l.apply.length ? ["Apply it"] : []), "Take a side"];
  const step = Math.min(ls.step, steps.length - 1), name = steps[step];
  const allAnswered = l.questions.every(i => ls.answers[i] != null);
  const canNext = name === "Warm-up" ? ls.poll !== null : name === "Questions" ? allAnswered : true;
  let body = "";
  if (name === "Warm-up") {
    body = `<section class="stack">
      <span class="eyebrow">What makes a good government?</span>
      <h2 class="question">${esc(l.warmup.prompt)}</h2>
      <div class="answers" role="group" aria-label="Answers">${l.warmup.options.map((o, k) => `<button class="answer" data-poll="${k}" aria-pressed="${ls.poll === k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o.text)}</span></button>`).join("")}</div>
      ${ls.poll !== null ? `<p class="feedback">${esc(whoSays(l.warmup.options[ls.poll].who))} There is no single correct answer. Be prepared to explain your reasoning.</p>` : ""}
      <p class="muted"><strong>Think and write on your worksheet:</strong> ${esc(l.warmup.think)}</p>
      ${l.pairNote ? `<p class="muted" style="font-size:0.9rem">${esc(l.pairNote)}</p>` : ""}
    </section>`;
  } else if (name === "Questions") {
    body = `<section class="sheet">
      <p class="muted" style="margin-bottom:14px">Answer for yourself. At the end you'll see whether your society looks more like ${esc(vs(l).replace(" vs. ", "'s or "))}'s.</p>
      ${l.questions.map((i, n) => `<div class="lq">
        <span class="eyebrow">${n + 1} of ${l.questions.length} · ${esc(DATA.questions[i].area)}</span>
        <h3>${esc(DATA.questions[i].q)}</h3>
        <div class="answers" role="group">${DATA.questions[i].answers.map((a, k) => `<button class="answer" data-q="${i}" data-k="${k}" aria-pressed="${ls.answers[i] === k}"><span class="letter">${LETTERS[k]}</span><span>${esc(a.text)}</span></button>`).join("")}</div>
      </div>`).join("")}
    </section>`;
  } else if (name === "Results") {
    const rows = lessonScore(l, ls), lead = rows[0];
    body = `<header class="verdict">
        <p class="big">Your society is <em>${lead.pct}% ${esc(short(lead.id))}</em></p>
        <div class="bars">${rows.map((r, k) => `<div class="bar ${k === 0 ? "top" : ""}"><span class="name">${esc(T[r.id].name)}</span><span class="track"><span class="fill" style="display:block;width:${rows[0].share ? (r.share / rows[0].share) * 100 : 0}%"></span></span><span class="pct">${r.pct}%</span></div>`).join("")}</div>
      </header>
      <section class="sheet stack">
        <h2>Where you agree with each</h2>
        <div class="pair">${l.pair.map(id => {
          const ag = l.questions.filter(i => pts(DATA.questions[i].answers[ls.answers[i]], id));
          return `<div><h4>${esc(short(id))}</h4><ul>${ag.length ? ag.map(i => `<li>${esc(DATA.questions[i].answers[ls.answers[i]].text)}${cite(id, i, "Where " + short(id) + " says it")}</li>`).join("") : `<li>Nowhere in this round.</li>`}</ul></div>`;
        }).join("")}</div>
      </section>
      <section class="sheet stack">
        <h2>What they witnessed, what they believed</h2>
        <p class="muted" style="font-size:0.9rem">Contextualization: what happened during each thinker's lifetime helps explain their ideas.</p>
        ${l.pair.map(id => `<div class="stack" style="gap:6px"><h3>${esc(T[id].name)} <span class="muted" style="font:0.8rem var(--mono)">${esc(T[id].lived)}</span></h3>
          <div class="ctx"><div class="cell"><span class="lab">What ${esc(short(id))} witnessed</span><br>${esc(l.context[id][0])}</div><span class="arrow" aria-hidden="true">→</span><div class="cell"><span class="lab">What ${esc(short(id))} believed</span><br>${esc(l.context[id][1])}</div></div></div>`).join("")}
        <div class="row"><button class="btn ghost" id="ln-timeline">See their world in the timeline</button></div>
      </section>
      <section class="sheet stack">
        <h2>Primary sources</h2>
        <p class="muted" style="font-size:0.9rem">The excerpts from your worksheet. Each link opens the full passage in the original book, so you can read what comes before and after.</p>
        ${l.excerpts.map(e => `<div class="excerpt"><span class="who">${esc(T[e.who].name)}</span><blockquote>"${esc(e.text)}"<span class="src">${e.adapted ? "Adapted from " : ""}${ext(e.url, esc(e.src))}${e.adapted ? ". The worksheet puts this in modern words; the link has the original." : ""}</span></blockquote></div>`).join("")}
      </section>`;
  } else if (name === "Apply it") {
    body = l.apply.map((a, n) => `<section class="sheet stack">
      <span class="eyebrow">Apply what you learned</span>
      <h2>${esc(a.title)}</h2>
      <p>${esc(a.scenario)}</p>
      <div class="answers" role="group">${a.options.map((o, k) => `<button class="answer" data-ap="${n}" data-k="${k}" aria-pressed="${ls.apply[n] === k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o.text)}</span></button>`).join("")}</div>
      ${ls.apply[n] != null ? `<p class="feedback">${esc(a.options[ls.apply[n]].note)}</p>` : ""}
    </section>`).join("") + `<p class="muted">Explain your reasoning on your worksheet.</p>`;
  } else {
    const rows = lessonScore(l, ls);
    const ev = rows.map(r => ({ id: r.id, items: l.questions.filter(i => pts(DATA.questions[i].answers[ls.answers[i]], r.id) === 2) }));
    body = `<section class="stack">
      <span class="eyebrow">Take a side</span>
      <h2>${esc(l.claim)}</h2>
      <div class="sheet stack" style="gap:8px">
        <h3 style="font-size:1.05rem">Evidence you could start from</h3>
        ${ev.map(e => `<p style="font-size:0.92rem"><strong>${esc(short(e.id))}:</strong> ${e.items.length ? e.items.map(i => `you chose "${esc(DATA.questions[i].answers[ls.answers[i]].text)}"`).join("; ") : "you didn't pick any of their clear positions"}.</p>`).join("")}
        <p class="muted" style="font-size:0.85rem">Use ideas from the reading and the primary sources, not just your answers here.</p>
      </div>
      <label for="claim" class="muted">Your answer</label>
      <textarea class="claim" id="claim" placeholder="I agree more with...">${esc(ls.claim)}</textarea>
      <div class="row"><button class="btn" id="ln-copy">Copy my answer</button></div>
      <span class="toast" id="ln-toast" aria-live="polite"></span>
    </section>`;
  }
  app.innerHTML = `
    <header class="mast">
      <span class="eyebrow">Lesson ${esc(l.id)} · ${esc(vs(l))}</span>
      <h1 style="font-size:clamp(1.7rem,5vw,2.4rem)">${esc(l.title)}</h1>
      <p>${esc(l.big)}</p>
      <ol class="steps" aria-label="Steps">${steps.map((s, k) => `<li class="${k === step ? "on" : k < step ? "done" : ""}">${k + 1}. ${esc(s)}</li>`).join("")}</ol>
    </header>
    ${body}
    <div class="nav">
      <button class="btn ghost" id="ln-back">${step === 0 ? "All lessons" : "Back"}</button>
      ${step < steps.length - 1 ? `<button class="btn" id="ln-next" ${canNext ? "" : "disabled"}>${name === "Questions" ? "See my result" : "Next"}</button>` : ""}
    </div>
    ${name === "Questions" && !allAnswered ? `<p class="muted" style="text-align:right">Answer all ${l.questions.length} questions to see your result.</p>` : ""}`;
  const rerender = () => { save(); const y = window.scrollY; renderLesson(); window.scrollTo(0, y); };
  app.querySelectorAll("[data-poll]").forEach(b => b.onclick = () => { ls.poll = +b.dataset.poll; rerender(); });
  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { ls.answers[b.dataset.q] = +b.dataset.k; rerender(); });
  app.querySelectorAll("[data-ap]").forEach(b => b.onclick = () => { ls.apply[b.dataset.ap] = +b.dataset.k; rerender(); });
  const claim = document.getElementById("claim");
  if (claim) claim.oninput = () => { ls.claim = claim.value; save(); };
  document.getElementById("ln-back").onclick = () => { if (step === 0) go("lessons"); else { ls.step = step - 1; go("lesson"); } };
  const next = document.getElementById("ln-next");
  if (next) next.onclick = () => { ls.step = step + 1; go("lesson"); };
  const tl = document.getElementById("ln-timeline");
  if (tl) tl.onclick = openTimeline;
  const copy = document.getElementById("ln-copy");
  if (copy) copy.onclick = () => {
    const rows = lessonScore(l, ls);
    const text = [`Lesson ${l.id}: ${l.title}`, ``,
      `Warm-up: ${l.warmup.options[ls.poll]?.text || "(skipped)"}`,
      `My result: ${rows.map(r => `${r.pct}% ${T[r.id].name}`).join(", ")}`, ``,
      l.claim, ``, ls.claim || "(no answer yet)"].join("\n");
    copyText(text, claim, "ln-toast", "Copied. Paste it into your assignment.");
  };
}

      </div>
    </section>
    <div class="row"><button class="btn ghost" id="src-back2">${backLabel()}</button></div>`;
  document.getElementById("src-back").onclick = goBack;
  document.getElementById("src-back2").onclick = goBack;
